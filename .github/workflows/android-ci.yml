name: Android CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        # Caches the Gradle distribution and dependencies between runs.
        uses: gradle/actions/setup-gradle@v6.4.0

      # Emulator tests stay local: on hosted runners they are slow and flaky.
      # assembleRelease runs R8: catches shrinking problems before they reach the phone.
      - name: Build, lint and unit tests
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:lintDebug :app:testDebugUnitTest

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
